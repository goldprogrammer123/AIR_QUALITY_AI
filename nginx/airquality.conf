# /etc/nginx/sites-available/airquality
# Setup commands:
#   sudo cp ~/air_quality_ai/nginx/airquality.conf /etc/nginx/sites-available/airquality
#   sudo ln -s /etc/nginx/sites-available/airquality /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d airquality-ai.tlms.live -d www.airquality-ai.tlms.live

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name airquality-ai.tlms.live www.airquality-ai.tlms.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name airquality-ai.tlms.live www.airquality-ai.tlms.live;

    # Certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/airquality-ai.tlms.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airquality-ai.tlms.live/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
