name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  # ── Build images and push to Docker Hub ──────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU lets the x86 GitHub runner build ARM64 images for Oracle Free Tier.
      # Remove both QEMU and Buildx steps (and change platforms below) if your
      # Oracle instance is AMD64 instead of ARM64.
      - name: Set up QEMU (ARM64 cross-build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: goldprogrammer123
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend image ───────────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            goldprogrammer123/airquality-backend:latest
            goldprogrammer123/airquality-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Frontend image ──────────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            goldprogrammer123/airquality-frontend:latest
            goldprogrammer123/airquality-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── SSH into Oracle server and restart containers ─────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key:      ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e

            # Go to the project folder on the server
            cd ~/air_quality_ai

            # Pull latest images
            docker compose pull

            # Restart — zero downtime: new containers start before old ones stop
            docker compose up -d --remove-orphans

            # Remove dangling images to keep disk clean
            docker image prune -f

            echo "Deployment complete ✓"
