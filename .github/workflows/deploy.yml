name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  # ── Build images and push to Docker Hub ──────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU lets the x86 GitHub runner build ARM64 images for Oracle Free Tier.
      # Remove both QEMU and Buildx steps (and change platforms below) if your
      # Oracle instance is AMD64 instead of ARM64.
      - name: Set up QEMU (ARM64 cross-build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: goldprogrammer123
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend image ───────────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            goldprogrammer123/airquality-backend:latest
            goldprogrammer123/airquality-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Frontend image ──────────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            goldprogrammer123/airquality-frontend:latest
            goldprogrammer123/airquality-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── SSH into Oracle server and restart containers ─────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud
        env:
          SSH_KEY:  ${{ secrets.ORACLE_SSH_KEY }}
          HOST:     ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              "$SSH_USER@$HOST" \
              "cd ~/air_quality_ai && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f && echo 'Deployment complete'"
