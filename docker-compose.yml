version: "3.9"

services:

  # ── PostgreSQL — user accounts & model history ──────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aq_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-aqi_db}
      POSTGRES_USER:     ${POSTGRES_USER:-aqi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqi_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqi_user} -d ${POSTGRES_DB:-aqi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────────────────────
  backend:
    image: goldprogrammer123/airquality-backend:latest
    container_name: aq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    # Secrets come from .env on the Oracle server (not committed to git)
    env_file: .env

    volumes:
      - ./backend/model_history:/app/model_history
      - ./backend/data/cache:/app/data/cache

    # No host port — backend is only reachable from inside the Docker network.
    # The frontend nginx container proxies /api/* to it on backend:8000.

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React frontend (nginx) ──────────────────────────────────────────────
  frontend:
    image: goldprogrammer123/airquality-frontend:latest
    container_name: aq_frontend
    restart: unless-stopped

    # Bind to localhost only — host nginx will proxy to this port over SSL.
    # The container is NOT directly reachable from the internet.
    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:

networks:
  default:
    name: aq_network
